workflows:
  android-debug:
    name: Map Notes - Android
    max_build_duration: 30
    instance_type: linux
    environment:
      flutter: stable
      # In Codemagic, add SUPABASE_URL and SUPABASE_ANON_KEY (from your
      # Supabase project → Project Settings → API — the anon key is the
      # publishable, client-safe one) under a variable group named "env",
      # then this pulls both into the build automatically.
      groups:
        - env
    scripts:
      - name: Write .env
        script: |
          cat > .env << EOF
          YANDEX_MAPKIT_API_KEY=
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          EOF
      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
