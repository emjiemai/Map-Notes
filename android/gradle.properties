org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
# Gradle daemon IPC needs a loopback socket handshake that this environment
# blocks ("Unable to establish loopback connection") — running daemonless
# avoids it entirely. Costs some build speed, not correctness.
# Heap is capped low (this machine has 7.7GB RAM total, WSL's VM only 3.7GB)
# — the default -Xmx8G triggered an OOM kill of the Gradle build process.
org.gradle.daemon=false
org.gradle.vfs.watch=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
