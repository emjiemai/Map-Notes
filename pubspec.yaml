name: map_notes
description: Field visit logging app for B2B sales reps — pin where you went, leave a note.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Dev/testing map — free OpenStreetMap tiles, no API key, no native setup.
  # Swap for yandex_mapkit before release (see README "Switching to Yandex MapKit").
  flutter_map: ^8.3.1
  latlong2: ^0.9.1
  supabase_flutter: ^2.17.2
  flutter_dotenv: ^5.1.0
  geolocator: ^13.0.1
  intl: ^0.19.0
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # Named without a leading dot deliberately — web servers commonly
    # refuse to serve dotfiles, which silently breaks flutter_dotenv on
    # web specifically (dotenv.load() doesn't even throw, it just leaves
    # everything empty) while working fine on Android/iOS.
    - app.env
