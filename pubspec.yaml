name: map_notes
description: Field visit logging app for B2B sales reps — pin where you went, leave a note.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Dev/testing map — free OpenStreetMap tiles, no API key, no native setup.
  # Swap for yandex_mapkit before release (see README "Switching to Yandex MapKit").
  flutter_map: ^8.3.1
  latlong2: ^0.9.1
  supabase_flutter: ^2.17.2
  flutter_dotenv: ^5.1.0
  geolocator: ^13.0.1
  intl: ^0.19.0
  image_picker: ^1.1.2
  # Real background location for Android (foreground service + persistent
  # notification) — geolocator alone can't survive the app being closed or
  # the screen locked for long. No web implementation exists (nor could
  # one — the browser Geolocation API has no background concept), so the
  # plain geolocator path in LocationTracker stays the web engine.
  tracelet: ^3.8.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # Named without a leading dot deliberately — web servers commonly
    # refuse to serve dotfiles, which silently breaks flutter_dotenv on
    # web specifically (dotenv.load() doesn't even throw, it just leaves
    # everything empty) while working fine on Android/iOS.
    - app.env

# tracelet 3.8.7 was published with its Rust glue code generated against
# flutter_rust_bridge 2.12.0, but its own pubspec constraint is loose
# enough that pub resolves the newer 2.13.0 instead — and
# flutter_rust_bridge refuses to run when codegen/runtime versions don't
# match exactly (confirmed on a real device: "Bad state: tracelet_core's
# codegen version (2.12.0) should be the same as runtime version
# (2.13.0)"). Pinning the transitive dependency down to what tracelet
# actually shipped against is the documented fix for this class of
# mismatch, not a version tracelet's own constraints would pick on their
# own.
dependency_overrides:
  flutter_rust_bridge: 2.12.0
